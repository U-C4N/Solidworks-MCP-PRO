[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp-pro"
version = "0.6.0"
description = "Verified SolidWorks engineering: design requirements, isolated variants and native Visualize shot packs"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["solidworks-mcp==0.19.0", "mcp==1.30.0", "jsonschema>=4.23,<5", "Pillow>=11,<13", "comtypes==1.4.17; sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/U-C4N/Solidworks-MCP-PRO"
Issues = "https://github.com/U-C4N/Solidworks-MCP-PRO/issues"
Changelog = "https://github.com/U-C4N/Solidworks-MCP-PRO/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11"]

[project.scripts]
solidworks-mcp-pro = "solidworks_mcp_pro.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidworks_mcp_pro = ["viewer.html", "guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running licensed SolidWorks session"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
