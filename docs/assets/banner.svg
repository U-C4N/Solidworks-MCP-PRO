<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Design with intent. Deliver with evidence.</title>
  <desc id="description">A dark engineering grid, a line drawing of a mounting plate, and a requirements-to-render workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#123b49"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82f1df" stop-opacity=".16"/>
      <stop offset="1" stop-color="#82f1df" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ad2dd" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 359H1280" stroke="#72eed4" stroke-opacity=".35"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="52" y="55" fill="#78e8d2" font-size="13" font-weight="700" letter-spacing="3">ENGINEERING, THROUGH MCP</text>
    <text x="49" y="125" fill="#f5f9fc" font-size="51" font-weight="700" letter-spacing="-1.5">Design with intent.</text>
    <text x="49" y="185" fill="#f5f9fc" font-size="51" font-weight="700" letter-spacing="-1.5">Deliver with evidence.</text>
    <text x="52" y="224" fill="#b6cbd6" font-size="17">Native SOLIDWORKS geometry. Measured requirements. Real Visualize renders.</text>
    <g transform="translate(52 266)">
      <rect width="138" height="42" rx="9" fill="#163b46" stroke="#5ddac2" stroke-opacity=".35"/>
      <text x="69" y="26" fill="#c8fff0" font-size="13" font-weight="600" text-anchor="middle">VERIFY DESIGN</text>
      <path d="M148 21h26m-6-5 6 5-6 5" fill="none" stroke="#6996a6" stroke-width="1.5"/>
      <rect x="184" width="138" height="42" rx="9" fill="#163b46" stroke="#5ddac2" stroke-opacity=".35"/>
      <text x="253" y="26" fill="#c8fff0" font-size="13" font-weight="600" text-anchor="middle">COMPARE VARIANTS</text>
      <path d="M332 21h26m-6-5 6 5-6 5" fill="none" stroke="#6996a6" stroke-width="1.5"/>
      <rect x="368" width="138" height="42" rx="9" fill="#163b46" stroke="#5ddac2" stroke-opacity=".35"/>
      <text x="437" y="26" fill="#c8fff0" font-size="13" font-weight="600" text-anchor="middle">PRESENT RESULTS</text>
    </g>
    <g transform="translate(868 22)">
      <path d="M20 37 229 0l80 70v178l-209 39L20 216Z" fill="url(#plate)" stroke="#7ee5d5" stroke-width="1.5"/>
      <path d="m20 37 80 71 209-38M100 108v179" fill="none" stroke="#7ee5d5" stroke-width="1.5"/>
      <path d="M100 108 20 37M229 0v178l80 70" fill="none" stroke="#7ee5d5" stroke-opacity=".25" stroke-dasharray="5 6"/>
      <ellipse cx="204" cy="176" rx="35" ry="42" transform="rotate(17 204 176)" fill="#102c38" stroke="#a1f6e6" stroke-width="1.5"/>
      <g fill="#102c38" stroke="#a1f6e6" stroke-width="1.3">
        <ellipse cx="128" cy="130" rx="8" ry="10"/>
        <ellipse cx="278" cy="102" rx="8" ry="10"/>
        <ellipse cx="128" cy="254" rx="8" ry="10"/>
        <ellipse cx="278" cy="226" rx="8" ry="10"/>
      </g>
      <path d="m107 312 200-38m-205 32 8 12m193-50 8 12M-3 46v170m-6-170h12m-12 170h12" fill="none" stroke="#7bb0bd" stroke-width="1"/>
      <text x="198" y="326" fill="#9cc6d0" font-size="10" text-anchor="middle">NATIVE GEOMETRY / EXPLICIT CHECKS</text>
    </g>
  </g>
</svg>
